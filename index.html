<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智能纪元编年史 · 2022—2026</title>
<meta name="description" content="从 ChatGPT（GPT-3.5）上线开始，沿一条时间线穿越生成式 AI 的关键时刻。">
<link rel="preconnect" href="https://fonts.loli.net">
<link rel="preconnect" href="https://gstatic.loli.net" crossorigin>
<link rel="stylesheet" href="https://fonts.loli.net/css2?family=Sora:wght@200..700&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
  :root {
    --black: #000;
    --glass: rgba(12, 12, 14, 0.88);
    --edge: rgba(255, 255, 255, 0.09);
    --white: #F4F4F6;
    --silver: #B4B4BC;
    --mute: #74747D;

    /* 类别色只落在很小的点上，其余一律黑白 */
    --c-model: #9CCFE0;
    --c-open: #A3D9BC;
    --c-product: #E2C29C;
    --c-policy: #E3A3B0;
    --c-science: #BFB2E3;
    --c-industry: #D9D3A0;

    --num: "Sora", "Segoe UI", "Microsoft YaHei", sans-serif;
    --text: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --px: clamp(18px, 4vw, 64px);
    --ease: cubic-bezier(.2, .8, .2, 1);
    --R: 56px; /* 日蚀半径 */
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--black);
    color: var(--white);
    font-family: var(--text);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 1.5px solid var(--white); outline-offset: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Atmosphere: black, haze, grain ---------- */
  #dust { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; }
  /* 光晕、暗角、颗粒都画在这张画布里：全屏半透明层叠得越多，合成时每帧要混合的像素就越多 */

  .app {
    position: relative; z-index: 1;
    height: 100vh; height: 100svh;
    overflow: hidden;
    display: grid;
    grid-template-rows: auto 1fr auto;
    grid-template-columns: minmax(0, 1fr);
    padding: 26px var(--px) 24px;
  }

  /* ---------- Header ---------- */
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px 40px; flex-wrap: wrap; }
  .top > div { min-width: 0; }
  h1 { margin: 0; font-size: 0.95rem; font-weight: 400; letter-spacing: 0.24em; color: var(--white); }
  .clock {
    margin: 8px 0 0;
    font-family: var(--num);
    font-weight: 200;
    font-size: clamp(1.6rem, 3vw, 2.6rem);
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    color: var(--white);
  }
  .clock .unit { font-family: var(--text); font-weight: 400; font-size: 0.4em; color: var(--mute); margin: 0 0.9em 0 0.3em; vertical-align: 0.55em; }
  .clock .hms { font-size: 0.5em; color: var(--silver); }
  .since { margin: 4px 0 0; font-size: 0.8rem; color: var(--mute); }

  .filters { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; max-width: 640px; min-width: 0; }
  .chip {
    flex: none;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 15px;
    font-size: 0.82rem; line-height: 1.5;
    color: var(--mute);
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 999px;
    cursor: pointer;
    transition: color .2s, border-color .2s, background .2s;
  }
  .chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--k, var(--white)); opacity: .35; transition: opacity .2s; }
  .chip:hover { color: var(--silver); border-color: rgba(255, 255, 255, 0.24); }
  .chip[aria-pressed="true"] { color: var(--white); border-color: rgba(255, 255, 255, 0.34); background: rgba(255, 255, 255, 0.05); }
  .chip[aria-pressed="true"] i { opacity: 1; }
  .chip .n { font-family: var(--num); font-weight: 300; font-size: 0.85em; color: var(--mute); }

  /* ---------- Stage ---------- */
  .stage { position: relative; margin: 0 calc(-1 * var(--px)); }

  /* 巨大的年份：横向拖影 + 扫描切片，像被高速掠过的字 */
  .ghost {
    position: absolute; left: 0; top: 0;
    margin: 0;
    font: 700 clamp(7rem, 19vw, 18rem)/1 var(--num);
    letter-spacing: -0.03em;
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
    will-change: transform;
    transition: transform 1.1s var(--ease);
  }
  .ghost span {
    display: block;
    color: rgba(255, 255, 255, 0.06);
    text-shadow: -5px 0 rgba(170, 140, 255, 0.07), 5px 0 rgba(130, 255, 210, 0.05);
    filter: url(#streak);
    -webkit-mask-image: repeating-linear-gradient(to bottom, #000 0 2px, rgba(0, 0, 0, 0.45) 2px 4px);
            mask-image: repeating-linear-gradient(to bottom, #000 0 2px, rgba(0, 0, 0, 0.45) 2px 4px);
  }

  .panel {
    position: absolute; left: 0;
    width: min(620px, calc(100% - 2 * var(--px)));
    padding: 24px 30px 22px;
    background: var(--glass);
    border: 1px solid var(--edge);
    border-radius: 22px;
    box-shadow: 0 30px 80px -30px #000;
    contain: layout style;
    will-change: transform;
    transition: transform .8s var(--ease);
  }
  .p-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; font-size: 0.82rem; color: var(--mute); }
  .p-head b { font-family: var(--num); font-weight: 500; color: var(--silver); margin-right: 10px; }
  .p-head .seq { font-family: var(--num); font-weight: 300; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .p-when { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; margin-top: 18px; }
  .p-when time { font-family: var(--num); font-weight: 300; font-size: 1.3rem; line-height: 1.2; color: var(--white); font-variant-numeric: tabular-nums; }
  .p-when span { font-family: var(--num); font-weight: 300; font-size: 0.9rem; color: var(--mute); }
  .panel h2 {
    margin: 8px 0 0;
    font-size: clamp(1.7rem, 3.4vw, 2.9rem);
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: 0.01em;
    text-shadow: -1px 0 rgba(170, 130, 255, 0.4), 1px 0 rgba(120, 255, 200, 0.28), 0 0 30px rgba(255, 255, 255, 0.12);
  }
  .panel p { margin: 12px 0 0; color: #A3A3AB; font-size: 1rem; line-height: 1.8; max-width: 34em; }
  .p-meta { display: flex; flex-wrap: wrap; gap: 4px 20px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--edge); font-size: 0.84rem; color: var(--mute); }
  .p-meta .cat { display: inline-flex; align-items: center; gap: 8px; color: var(--silver); }
  .p-meta .cat::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--k); }

  .leader { position: absolute; left: 0; width: 1px; background: linear-gradient(to bottom, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0)); transition: transform .8s var(--ease); }

  /* ---------- The line ---------- */
  .rail { position: absolute; left: 0; right: 0; height: 0; contain: layout style; }
  .rail-line {
    position: absolute; left: var(--px); right: var(--px); top: 0; height: 1px;
    background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.2) 6%, rgba(255, 255, 255, 0.2) 94%, transparent);
  }
  .rail-lit { position: absolute; left: 0; top: 0; height: 1px; width: 1000px; transform-origin: 0 0; transform: scaleX(0); background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.6)); transition: transform .8s var(--ease); }
  .rail-hit { position: absolute; left: 0; right: 0; top: -44px; height: 88px; cursor: ew-resize; touch-action: none; }
  .rail-hit:focus-visible { outline: none; }
  .rail-hit:focus-visible ~ .eclipse .ring { border-color: rgba(255, 255, 255, 0.6); }

  /* 节点三种形态：远处压成刻度条，近处是彩色点，重大事件带细环 */
  .dot {
    position: absolute; left: 0; top: 0;
    width: 0; height: 0;
    transition: transform .8s var(--ease), opacity .8s;
    cursor: pointer;
  }
  .dot:hover { opacity: 1 !important; z-index: 2; }
  .dot[hidden] { display: none; }
  .dot::before {
    content: ""; position: absolute;
    width: 5px; height: 5px; left: -2.5px; top: -2.5px;
    border-radius: 50%;
    background: var(--k);
    box-shadow: 0 0 0 3px #000;
    transition: transform .5s var(--ease), background-color .5s, box-shadow .5s;
  }
  .dot.major::before { width: 7px; height: 7px; left: -3.5px; top: -3.5px; background: var(--white); box-shadow: 0 0 0 3px #000, 0 0 0 4px color-mix(in srgb, var(--k) 70%, transparent); }
  /* 远处压成刻度条：5×5 → 1×7，7×7 → 1×13 */
  .dot.tick::before { transform: scale(.2, 1.4); border-radius: 0; background: rgba(255, 255, 255, 0.34); box-shadow: none; }
  .dot.tick.major::before { transform: scale(.143, 1.857); background: rgba(255, 255, 255, 0.75); }
  .dot::after { content: ""; position: absolute; left: -7px; top: -16px; width: 14px; height: 32px; }
  .dot:hover::before { transform: scale(1.6); }
  .dot.tick:hover::before { transform: scale(.2, 2.6); background: var(--white); }
  .dot.tick.major:hover::before { transform: scale(.143, 2.6); }

  .dot .lbl {
    position: absolute; top: 16px; left: 0;
    width: var(--lw, 132px); margin-left: calc(var(--lw, 132px) / -2);
    text-align: center;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity .35s, transform .5s var(--ease);
    pointer-events: none;
    text-shadow: 0 0 8px #000, 0 0 3px #000, 0 0 1px #000;
  }
  .dot .lbl time { display: block; font: 300 11px/1 var(--num); color: #8B8B94; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .dot.major .lbl time { color: var(--silver); font-weight: 400; }
  .dot .lbl em { display: none; margin-top: 7px; font-style: normal; font-size: 12px; line-height: 1.4; color: var(--silver); overflow: hidden; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .dot.near .lbl { opacity: 1; transform: none; }
  .dot.near.named .lbl em { display: -webkit-box; }
  .dot .tip {
    position: absolute; bottom: 18px; left: 0;
    transform: translateX(-50%);
    padding: 5px 12px;
    font-size: 12px; line-height: 1.5;
    white-space: nowrap;
    background: rgba(20, 20, 22, 0.94);
    border: 1px solid var(--edge);
    border-radius: 999px;
    opacity: 0; pointer-events: none;
    transition: opacity .15s;
  }
  .dot:hover .tip { opacity: 1; }
  .dot.cur { visibility: hidden; }

  /* 年份刻度挂在线的上方，把日期留给下方 */
  .yt { position: absolute; left: 0; top: 0; transition: transform .8s var(--ease), opacity .3s; pointer-events: none; }
  .yt::before { content: ""; position: absolute; left: 0; top: -26px; width: 1px; height: 32px; background: linear-gradient(to top, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0)); }
  .yt span { position: absolute; left: 7px; top: -26px; font: 300 13px/1 var(--num); color: var(--mute); transition: color .3s, opacity .3s; text-shadow: 0 0 8px #000, 0 0 2px #000; }
  .yt.cur span { color: var(--white); font-weight: 500; }
  .yt.end span { left: auto; right: 7px; }
  .yt.tight span, .yt.under span { opacity: 0; }

  /* 日蚀：黑色圆盘挡住光线，边缘被背光点亮 */
  .eclipse { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; will-change: transform; transition: transform .8s var(--ease); }
  .eclipse .disc, .eclipse .ring { position: absolute; left: calc(-1 * var(--R)); top: calc(-1 * var(--R)); width: calc(2 * var(--R)); height: calc(2 * var(--R)); border-radius: 50%; }
  .eclipse .disc {
    background: radial-gradient(circle, #000 60%, rgba(0, 0, 0, 0.8));
    will-change: transform;
    transition: transform 1.1s var(--ease);
    box-shadow:
      inset -3px -4px 3px -1px rgba(255, 255, 255, 0.95),
      inset -12px -14px 22px -10px rgba(255, 255, 255, 0.4),
      5px 7px 22px -4px rgba(255, 255, 255, 0.5),
      12px 16px 60px -8px rgba(255, 255, 255, 0.22),
      0 0 90px rgba(255, 255, 255, 0.06);
  }
  .eclipse .ring { border: 1px solid rgba(255, 255, 255, 0.1); transform: scale(1.35); transition: border-color .2s; }
  .eclipse .core { position: absolute; left: -3px; top: -3px; width: 6px; height: 6px; border-radius: 50%; background: var(--white); box-shadow: 0 0 10px rgba(255, 255, 255, 0.8); }
  .eclipse .core::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.55); }

  /* ---------- Controls ---------- */
  .controls { display: flex; justify-content: space-between; align-items: center; gap: 12px 24px; flex-wrap: wrap; }
  .step { display: flex; gap: 12px; }
  .step button {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 22px;
    font-size: 0.9rem;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 999px;
    cursor: pointer;
    transition: background .2s, border-color .2s;
  }
  .step button:hover { background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.4); }
  .step button:disabled { opacity: .3; cursor: default; background: transparent; border-color: rgba(255, 255, 255, 0.22); }
  .step svg { width: 14px; height: 14px; stroke: currentColor; }
  .hint { margin: 0; font-size: 0.82rem; color: var(--mute); }

  /* ---------- Load: black, then the rim ignites ---------- */
  .app:not(.booted) * { transition: none !important; }
  .booted .rail-line, .booted .dot, .booted .yt { animation: rise 1.4s ease-out .5s both; }
  .booted .eclipse .disc { animation: ignite 1.8s var(--ease) .2s both; }
  .booted .panel, .booted .leader { animation: rise 1s ease-out 1.2s both; }
  @keyframes rise { from { opacity: 0; } to { opacity: 1; } }
  @keyframes ignite { from { opacity: 0; filter: brightness(0); } 40% { opacity: 1; } to { opacity: 1; filter: brightness(1); } }

  @media (max-height: 700px) and (min-width: 761px) {
    .panel { padding: 18px 24px 16px; }
    .panel h2 { font-size: 2.2rem; }
    .p-when { margin-top: 12px; }
  }
  @media (max-width: 760px) {
    :root { --R: 44px; }
    .app { padding-top: 20px; }
    .filters { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; max-width: none; width: calc(100% + 2 * var(--px)); margin: 0 calc(-1 * var(--px)); padding: 0 var(--px); scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .panel { padding: 18px 20px; border-radius: 18px; }
    .panel p { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; font-size: 0.92rem; }
    .ghost { font-size: 7.5rem; }
    .hint { display: none; }
    .step { width: 100%; }
    .step button { flex: 1; justify-content: center; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="streak" x="-30%" y="-10%" width="160%" height="120%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceGraphic" stdDeviation="14 0" result="wide"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="soft"/>
    <feMerge><feMergeNode in="wide"/><feMergeNode in="wide"/><feMergeNode in="soft"/></feMerge>
  </filter>
</svg>
<canvas id="dust" aria-hidden="true"></canvas>

<div class="app" id="app">
  <header class="top">
    <div>
      <h1>智能纪元编年史</h1>
      <p class="clock" aria-label="距 ChatGPT 上线的时间">T+<span id="days">0</span><span class="unit">天</span><span class="hms" id="hms">00:00:00</span></p>
      <p class="since">自 2022 年 11 月 30 日 ChatGPT 上线起</p>
    </div>
    <div class="filters" id="filters" role="group" aria-label="按类别筛选"></div>
  </header>

  <section class="stage" id="stage">
    <p class="ghost" id="ghost" aria-hidden="true"><span id="ghostText"></span></p>
    <article class="panel" id="panel" style="--k: var(--c-model)">
      <div class="p-head"><span id="chapter"></span><span class="seq" id="seq"></span></div>
      <div class="p-when"><time id="pdate"></time><span id="ptplus"></span></div>
      <h2 id="ptitle"></h2>
      <p id="pdesc"></p>
      <div class="p-meta"><span id="porg"></span><span class="cat" id="pcat"></span><span id="pgap"></span></div>
    </article>
    <div class="leader" id="leader" aria-hidden="true"></div>
    <div class="rail" id="rail">
      <div class="rail-line"></div>
      <div class="rail-lit" id="railLit"></div>
      <div class="rail-hit" id="railHit" tabindex="0" role="slider" aria-label="时间线"></div>
      <div class="eclipse" id="eclipse" aria-hidden="true">
        <div class="ring"></div>
        <div class="disc" id="disc"></div>
        <div class="core"></div>
      </div>
    </div>
  </section>

  <footer class="controls">
    <div class="step">
      <button type="button" id="prev"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>上一个</button>
      <button type="button" id="next">下一个<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <p class="hint" id="hint">滚动滚轮、按方向键，或沿时间线拖动</p>
  </footer>
  <p class="sr" id="live" aria-live="polite"></p>
</div>

<script>
const CATS = {
  model:    { name: "模型发布",   color: "var(--c-model)" },
  open:     { name: "开源",       color: "var(--c-open)" },
  product:  { name: "产品与智能体", color: "var(--c-product)" },
  policy:   { name: "治理与安全", color: "var(--c-policy)" },
  science:  { name: "科学",       color: "var(--c-science)" },
  industry: { name: "产业与资本", color: "var(--c-industry)" },
};

const YEARS = {
  2022: ["一个聊天框", "发布时它只被当作一次研究预览。五天后，用户过了一百万。"],
  2023: ["所有人都在追赶 GPT-4", "巨头入场，中国开启百模大战，开源权重流出，关于风险的公开信第一次登上头条。"],
  2024: ["能看、能听，也开始思考", "视频生成、原生多模态、推理模型相继出现，AI 拿下两项诺贝尔奖。"],
  2025: ["开源冲击与智能体之年", "DeepSeek 让低成本训练成为共识，模型从回答问题转向替人完成任务。"],
  2026: ["前沿加速", "旗舰模型的迭代周期缩短到以周计，最强模型开始限制访问，实验室第一次主动放缓训练。"],
};

// d: YYYY-MM-DD 或 YYYY-MM(仅到月)
const EVENTS = [
  { d: "2022-11-30", c: "product", o: "OpenAI", m: 1, t: "ChatGPT 上线", x: "以 GPT-3.5 系列模型为底座的对话界面作为研究预览免费开放，五天内用户突破一百万。一个聊天框，成了新纪元的起点。" },
  { d: "2022-12-07", c: "product", o: "Perplexity", t: "Perplexity 上线", x: "把检索和生成合成一个“答案引擎”，直接给出带来源的回答，对话式 AI 搜索由此起步。" },
  { d: "2022-12-15", c: "policy", o: "Anthropic", t: "Constitutional AI", x: "用一份写定的原则让模型批评、改写自己的输出，再以 AI 反馈做强化学习，减少对人工有害性标注的依赖。" },

  { d: "2023-01", c: "industry", o: "OpenAI", t: "ChatGPT 月活用户破亿", x: "上线约两个月即达成，是当时增长最快的消费级应用。" },
  { d: "2023-01-13", c: "policy", o: "艺术家群体", t: "艺术家起诉图像生成公司", x: "Stability AI、Midjourney 等被指用受版权保护的作品训练模型，训练数据的合法性之争就此开打。" },

const LAUNCH = Date.UTC(2022, 10, 30, 18, 0, 0); // 2022-11-30 10:00 PST
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = s => document.querySelector(s);
const DAY = 86400000;

/* ---------- Mission clock ---------- */
(() => {
  const daysEl = $("#days"), hmsEl = $("#hms");
  const pad = n => String(n).padStart(2, "0");
  const render = ms => {
    const s = Math.floor(ms / 1000);
    daysEl.textContent = Math.floor(s / 86400);
    hmsEl.textContent = `${pad(Math.floor(s % 86400 / 3600))}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`;
  };
  const t0 = performance.now(), dur = reduceMotion ? 0 : 2200;
  const frame = now => {
    const k = dur ? Math.min(1, (now - t0) / dur) : 1;
    render((Date.now() - LAUNCH) * (1 - Math.pow(1 - k, 4)));
    if (k < 1) requestAnimationFrame(frame);
    else setInterval(() => render(Date.now() - LAUNCH), 1000);
  };
  requestAnimationFrame(frame);
})();

/* ---------- Dust: sparse white particles drifting toward the viewer ---------- */
const drift = (() => {
  const cv = $("#dust"), ctx = cv.getContext("2d", { alpha: false });
  let W, H, dpr = 1, bg, running = !document.hidden, boost = 0, raf = 0, lastDraw = 0;
  let hx = innerWidth / 2, hxTo = hx; // 光晕中心，跟随焦点
  const pts = [];
  const N = innerWidth < 760 ? 110 : 200;
  const spawn = (p, z) => {
    p.x = (Math.random() - 0.5) * 2.4; p.y = (Math.random() - 0.5) * 1.6;
    p.z = z ?? Math.random() * 0.9 + 0.1;
    p.tw = Math.random() * Math.PI * 2;
    return p;
  };
  for (let i = 0; i < N; i++) pts.push(spawn({}));
  const t0 = performance.now();
  function draw(now) {
    const t = (now - t0) / 1000;
    const dt = Math.min(3, lastDraw ? (now - lastDraw) / 16.7 : 1); // 以 60fps 为 1，降帧时步长同比放大
    lastDraw = now;
    const v = reduceMotion ? 0 : (0.00022 + 0.008 * Math.exp(-t * 1.2) + boost) * dt;
    boost *= Math.pow(0.94, dt);
    hx = reduceMotion ? hxTo : hx + (hxTo - hx) * (1 - Math.exp(-dt / 14));
    const cx = W * 0.5, cy = H * 0.58, f = Math.max(W, H) * 0.5;
    ctx.globalAlpha = 1;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(bg, 0, 0);
    // 光晕：横 46vw、纵 38vh 的椭圆，中心压在时间线附近
    ctx.setTransform(dpr * W * 0.46, 0, 0, dpr * H * 0.38, dpr * hx, dpr * H * 0.62);
    ctx.fillStyle = haze;
    ctx.fillRect(-1, -1, 2, 2);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#fff";
    const streak0 = Math.abs(boost) * 900;
    for (const p of pts) {
      p.z -= v;
      if (p.z <= 0.03) { spawn(p, 1); continue; }
      if (p.z > 1) { spawn(p, 0.1 + Math.random() * 0.2); continue; }
      const sx = cx + p.x / p.z * f, sy = cy + p.y / p.z * f;
      if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) { spawn(p, 1); continue; }
      const near = 1 - p.z;
      // 暗角：椭圆半径 120% × 95%，55% 以内不压暗
      const vx = (sx - cx) / (W * 1.2), vy = (sy - H * 0.5) / (H * 0.95);
      const vig = Math.min(1, Math.max(0, (Math.sqrt(vx * vx + vy * vy) - 0.55) / 0.45));
      ctx.globalAlpha = (0.08 + near * 0.55) * (0.75 + 0.25 * Math.sin(t * 1.3 + p.tw)) * (1 - vig);
      const r = 0.4 + near * 1.3;
      const streak = Math.min(24, streak0 * near); // 跳转时拉出短短的横向拖影
      ctx.fillRect(sx - r - streak, sy - r * 0.5, r * 2 + streak * 2, r);
    }
  }
  const haze = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
  haze.addColorStop(0, "rgba(255, 255, 255, 0.045)");
  haze.addColorStop(1, "rgba(255, 255, 255, 0)");
  // 颗粒：一块随机噪点平铺在黑底上，只在尺寸变化时生成一次
  const tile = document.createElement("canvas");
  tile.width = tile.height = 192;
  {
    const tc = tile.getContext("2d"), img = tc.createImageData(192, 192), d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      d[i] = d[i + 1] = d[i + 2] = 255;
      d[i + 3] = (Math.random() + Math.random()) * 0.5 * 0.9 * 0.05 * 255;
    }
    tc.putImageData(img, 0, 0);
  }
  const resize = () => {
    dpr = Math.min(devicePixelRatio || 1, 1.5);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    bg = document.createElement("canvas");
    bg.width = cv.width; bg.height = cv.height;
    const bc = bg.getContext("2d", { alpha: false });
    bc.fillStyle = "#000";
    bc.fillRect(0, 0, bg.width, bg.height);
    bc.fillStyle = bc.createPattern(tile, "repeat");
    bc.fillRect(0, 0, bg.width, bg.height);
    // 暗角外圈把颗粒也压暗，和原来叠在上面的效果一致
    bc.setTransform(bg.width * 1.2, 0, 0, bg.height * 0.95, bg.width / 2, bg.height / 2);
    const vg = bc.createRadialGradient(0, 0, 0, 0, 0, 1);
    vg.addColorStop(0.55, "rgba(0, 0, 0, 0)");
    vg.addColorStop(1, "#000");
    bc.fillStyle = vg;
    bc.fillRect(-1, -1, 2, 2);
    draw(performance.now());
  };
  // 开场加速和跳转拖影时满帧，平时粒子几乎不动，30fps 足够
  const loop = now => {
    raf = 0;
    if (!running) return;
    const busy = now - t0 < 3000 || Math.abs(boost) > 0.0004 || Math.abs(hxTo - hx) > 0.5;
    if (busy || now - lastDraw >= 32) draw(now);
    raf = requestAnimationFrame(loop);
  };
  const start = () => { if (!reduceMotion && running && !raf) { lastDraw = 0; raf = requestAnimationFrame(loop); } };
  resize();
  addEventListener("resize", resize);
  start();
  document.addEventListener("visibilitychange", () => {
    running = !document.hidden;
    if (running) start(); else { cancelAnimationFrame(raf); raf = 0; }
  });
  const fn = dir => { if (!reduceMotion) boost = Math.max(-0.02, Math.min(0.02, boost + 0.007 * dir)); };
  fn.focus = x => {
    if (x === hxTo) return;
    hxTo = x;
    if (reduceMotion) draw(performance.now());
  };
  return fn;
})();

/* ---------- Year streak: 换年时拖影从很长收回来（只动 transform/opacity，走合成线程） ---------- */
const ghostText = $("#ghostText");
function streak() {
  if (reduceMotion || !ghostText.animate) return;
  ghostText.animate(
    [{ transform: "scaleX(1.6)", opacity: 0 }, { transform: "scaleX(1.12)", opacity: 1, offset: 0.35 }, { transform: "none", opacity: 1 }],
    { duration: 900, easing: "cubic-bezier(.2, .8, .2, 1)" }
  );
}

/* ---------- Events ---------- */
const utc = d => Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, d.length === 10 ? +d.slice(8) : 15);
const LAUNCH_DAY = Date.UTC(2022, 10, 30);
const fmtDate = d => d.length === 10 ? d.replace(/-/g, ".") : `${d.slice(0, 4)}.${d.slice(5, 7)}`;

const all = EVENTS
  .map((e, i) => ({ e, i, t: utc(e.d) }))
  .sort((a, b) => a.t - b.t || a.i - b.i)
  .map(({ e, t }) => ({ ...e, time: t }));

const stage = $("#stage"), rail = $("#rail"), railLit = $("#railLit"), railHit = $("#railHit");
const eclipse = $("#eclipse"), disc = $("#disc");
const panel = $("#panel"), leader = $("#leader"), ghost = $("#ghost");

const dots = all.map(e => {
  const el = document.createElement("div");
  el.className = "dot" + (e.m ? " major" : "");
  el.style.setProperty("--k", CATS[e.c].color);
  el.innerHTML = `<span class="lbl"><time>${e.d.length === 7 ? +e.d.slice(5, 7) + " 月" : fmtDate(e.d).slice(5)}</time><em>${e.t}</em></span><span class="tip">${fmtDate(e.d)}　${e.t}</span>`;
  el.addEventListener("click", () => go(vis.indexOf(el)));
  el._e = e;
  rail.insertBefore(el, eclipse);
  return el;
});

const yearTicks = {};
Object.keys(YEARS).forEach(y => {
  const el = document.createElement("div");
  el.className = "yt";
  el.innerHTML = `<span>${y}</span>`;
  rail.insertBefore(el, dots[0]);
  yearTicks[y] = el;
});

let vis = dots.slice(), k = 0, spin = 0;

const M = {};
function measure() {
  M.W = stage.clientWidth; M.H = stage.clientHeight;
  M.left = stage.getBoundingClientRect().left;
  M.px = parseFloat(getComputedStyle($("#app")).paddingLeft) || 40;
  M.R = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--R")) || 56;
  M.pw = panel.offsetWidth;
  M.gw = ghost.offsetWidth; M.gh = ghost.offsetHeight;
}
// 只在值变化时写入，避免每次切换都让 71 个节点重新算样式
const put = (el, key, val, write) => { if (el[key] !== val) { el[key] = val; write(val); } };
const setTf = (el, v) => put(el, "_tf", v, v => { el.style.transform = v; });
const setOp = (el, v) => put(el, "_op", v, v => { el.style.opacity = v; });
const setCls = (el, name, on) => { if (el.classList.contains(name) !== on) el.classList.toggle(name, on); };

/* 每段间距 = 底宽 + 以焦点为中心的高斯隆起：焦点两侧对称展开，远处压成等距刻度 */
function makeXs() {
  const W = M.W;
  const px = M.px;
  const r = M.R * 0.8;
  const L = px + r, D = W - px - r - L;
  const n = vis.length;
  if (n < 2) return [L + D / 2];
  const wide = W >= 760, sig = wide ? 2.2 : 1.6;
  const G = wide ? Math.min(165, D * 0.15) : D * 0.25; // 焦点旁的目标间距
  const bump = vis.slice(1).map((_, j) => Math.exp(-(((j + 0.5 - k) / sig) ** 2)));
  const S = bump.reduce((a, b) => a + b, 0);
  const P = Math.max(0, (G * (n - 1) - D) / Math.max(1e-6, D - G * S));
  const w = bump.map(b => 1 + P * b);
  const total = w.reduce((a, b) => a + b, 0);
  const xs = [L];
  w.forEach(v => xs.push(xs[xs.length - 1] + v / total * D));
  return xs;
}

function layout() {
  const { H, W, R, px, pw, gw, gh } = M;
  const railY = Math.round(H * (W < 760 ? 0.8 : 0.78));
  put(rail, "_top", railY, v => { rail.style.top = v + "px"; });

  const n = vis.length, xs = makeXs(), wide = W >= 760;
  const near = new Set(), named = new Map();
  // 标签从焦点往两侧贪心铺开：彼此不挤、也不钻进日蚀
  const minGap = wide ? 66 : 50, cx0 = xs[k];
  [-1, 1].forEach(dir => {
    const side = [];
    let last = cx0;
    for (let i = k + dir, step = 1; i >= 0 && i < n && step <= 6; i += dir, step++) {
      const x = xs[i];
      if (Math.abs(x - cx0) < R + 26) continue;
      if (Math.abs(x - last) < (last === cx0 ? R + 26 : minGap)) continue;
      near.add(i);
      side.push(i);
      last = x;
    }
    // 最靠近焦点的两个标签写出事件名，宽度按左右可用空间算，最多两行
    if (!wide) return;
    let prevHalf = 0;
    side.slice(0, 2).forEach((i, j) => {
      const next = side[j + 1];
      const inner = j === 0 ? Math.abs(xs[i] - cx0) - R - 10 : Math.abs(xs[i] - xs[side[j - 1]]) - prevHalf - 8;
      const outer = next === undefined ? 90 : Math.abs(xs[next] - xs[i]) - 20;
      const half = Math.min(inner, outer, 80);
      if (half >= 40) { named.set(i, Math.floor(half * 2)); prevHalf = half; }
      else prevHalf = 17;
    });
  });

  const shown = new Set(vis);
  dots.forEach(el => { if (!shown.has(el) && !el.hidden) el.hidden = true; });
  vis.forEach((el, i) => {
    if (el.hidden) el.hidden = false;
    setTf(el, `translateX(${xs[i].toFixed(1)}px)`);
    const gapL = i > 0 ? xs[i] - xs[i - 1] : 1e9, gapR = i < n - 1 ? xs[i + 1] - xs[i] : 1e9;
    setCls(el, "tick", Math.min(gapL, gapR) < (el._e.m ? 16 : 11));
    setOp(el, Math.max(0.35, 1 - Math.abs(i - k) / 16).toFixed(2));
    setCls(el, "near", near.has(i));
    setCls(el, "named", named.has(i));
    setCls(el, "cur", i === k);
    put(el, "_lw", named.get(i), v => v ? el.style.setProperty("--lw", v + "px") : el.style.removeProperty("--lw"));
  });

  // 年份刻度放在跨年的两个节点之间
  const curYear = vis[k]?._e.d.slice(0, 4);
  const seen = [], used = new Set();
  vis.forEach((el, i) => {
    const y = el._e.d.slice(0, 4);
    if (i === 0 || vis[i - 1]._e.d.slice(0, 4) !== y) {
      const x = i === 0 ? xs[0] - 14 : (xs[i - 1] + xs[i]) / 2;
      const t = yearTicks[y], end = x > W - 70;
      used.add(t);
      setOp(t, "1");
      setTf(t, `translateX(${x.toFixed(1)}px)`);
      setCls(t, "cur", y === curYear);
      setCls(t, "end", end);
      setCls(t, "under", Math.abs(x + (end ? -25 : 25) - xs[k]) < R + 30);
      seen.push([end ? x - 50 : x, t]); // 标签实际起点
    }
  });
  Object.values(yearTicks).forEach(t => { if (!used.has(t)) setOp(t, "0"); });
  seen.forEach(([x, t], j) => setCls(t, "tight", j < seen.length - 1 && seen[j + 1][0] - x < 52));

  const cx = xs[k] ?? W / 2, x0 = (xs[0] ?? cx) - 14;
  setTf(eclipse, `translateX(${cx.toFixed(1)}px)`);
  setTf(railLit, `translateX(${x0.toFixed(1)}px) scaleX(${(Math.max(0, cx - R - x0) / 1000).toFixed(4)})`);
  drift.focus(M.left + cx);

  // 大年份跟着焦点做轻微视差，竖直居中压在时间线上
  const gx = (W - gw) / 2 + (cx - W / 2) * 0.35;
  setTf(ghost, `translate(${gx.toFixed(1)}px, ${(railY - gh / 2).toFixed(1)}px)`);

  // 面板跟随焦点，但不出屏
  const left = Math.max(px, Math.min(W - px - pw, cx - pw * 0.3));
  const bottom = railY - R - (W < 760 ? 20 : 26);
  put(panel, "_bottom", H - bottom, v => { panel.style.bottom = v + "px"; });
  setTf(panel, `translateX(${left.toFixed(1)}px)`);
  put(leader, "_geo", `${bottom}/${railY - R - bottom}`, () => { leader.style.top = bottom + "px"; leader.style.height = (railY - R - bottom) + "px"; });
  setTf(leader, `translateX(${cx.toFixed(1)}px)`);
}

/* ---------- Focus ---------- */
const GLYPHS = "░▒▓▁▂▃▄▅";
function decode(el, text) {
  cancelAnimationFrame(el._raf);
  if (reduceMotion) { el.textContent = text; return; }
  const start = performance.now(), dur = 460;
  let last = 0;
  const tick = now => {
    // 乱码每 50ms 换一次就够了，每帧都换会让大标题每帧重排
    if (now - last < 50 && now - start < dur) { el._raf = requestAnimationFrame(tick); return; }
    last = now;
    const p = Math.min(1, (now - start) / dur);
    const r = Math.floor(p * text.length);
    let s = text.slice(0, r);
    for (let i = r; i < text.length; i++) s += text[i] === " " ? " " : GLYPHS[Math.random() * GLYPHS.length | 0];
    el.textContent = s;
    if (p < 1) el._raf = requestAnimationFrame(tick);
  };
  el._raf = requestAnimationFrame(tick);
  clearTimeout(el._done);
  el._done = setTimeout(() => { cancelAnimationFrame(el._raf); el.textContent = text; }, dur + 120);
}

let renderRaf = 0;
function schedule() {
  if (!renderRaf) renderRaf = requestAnimationFrame(() => { renderRaf = 0; render(); });
}

const $chapter = $("#chapter"), $seq = $("#seq"), $pdate = $("#pdate"), $ptplus = $("#ptplus"), $ptitle = $("#ptitle"),
  $pdesc = $("#pdesc"), $porg = $("#porg"), $pcat = $("#pcat"), $pgap = $("#pgap"), $prev = $("#prev"), $next = $("#next"), $live = $("#live");
let shownEl = null;
function render() {
  cancelAnimationFrame(renderRaf); renderRaf = 0;
  const el = vis[k]; if (!el) return;
  if (shownEl === el) { layout(); return; }
  shownEl = el;
  const e = el._e, c = CATS[e.c];
  const y = e.d.slice(0, 4);
  panel.style.setProperty("--k", c.color);
  if (ghostText.textContent !== y) {
    ghostText.textContent = y;
    M.gw = ghost.offsetWidth; M.gh = ghost.offsetHeight;
    streak();
  }
  $chapter.innerHTML = `<b>${y}</b>${YEARS[y][0]}`;
  $seq.textContent = `${String(k + 1).padStart(2, "0")} / ${vis.length}`;
  $pdate.textContent = fmtDate(e.d);
  $pdate.setAttribute("datetime", e.d);
  const tplus = Math.round((e.time - LAUNCH_DAY) / DAY);
  $ptplus.textContent = `T+${e.d.length === 7 ? "约 " : ""}${tplus} 天`;
  decode($ptitle, e.t);
  $pdesc.textContent = e.x;
  if (!reduceMotion && $pdesc.animate) $pdesc.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 500, easing: "ease-out" });
  $porg.textContent = e.o;
  $pcat.textContent = c.name;
  const prev = vis[k - 1]?._e;
  const gap = prev ? Math.round((e.time - prev.time) / DAY) : null;
  $pgap.textContent = e.d.length === 7 ? "日期只精确到月" : gap === null ? "编年起点" : gap === 0 ? "与上一节点同日" : `距上一节点 ${gap} 天`;

  $prev.disabled = k <= 0;
  $next.disabled = k >= vis.length - 1;
  railHit.setAttribute("aria-valuemin", 1);
  railHit.setAttribute("aria-valuemax", vis.length);
  railHit.setAttribute("aria-valuenow", k + 1);
  railHit.setAttribute("aria-valuetext", `${fmtDate(e.d)} ${e.t}`);
  $live.textContent = `${fmtDate(e.d)}，${e.t}。${e.x}`;
  layout();
}

function go(i) {
  i = Math.max(0, Math.min(vis.length - 1, i));
  if (i === k || i < 0) return;
  const dir = Math.sign(i - k);
  k = i;
  spin += 40 * dir; // 背光随移动方向绕盘面转动
  disc.style.transform = `rotate(${spin}deg)`;
  drift(dir);
  schedule();
}

/* ---------- Input ---------- */
$("#prev").addEventListener("click", () => go(k - 1));
$("#next").addEventListener("click", () => go(k + 1));

document.addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const map = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1, PageDown: 5, PageUp: -5 };
  if (e.key in map) { e.preventDefault(); go(k + map[e.key]); }
  else if (e.key === "Home") { e.preventDefault(); go(0); }
  else if (e.key === "End") { e.preventDefault(); go(vis.length - 1); }
});

let acc = 0, lastWheel = 0, lastStep = 0;
$("#app").addEventListener("wheel", e => {
  if (e.ctrlKey || e.target.closest(".filters")) return;
  e.preventDefault();
  const now = performance.now();
  if (now - lastWheel > 260) acc = 0;
  lastWheel = now;
  acc += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY * (e.deltaMode === 1 ? 32 : 1);
  if (Math.abs(acc) >= 50 && now - lastStep > 130) {
    go(k + Math.sign(acc));
    acc = 0; lastStep = now;
  }
}, { passive: false });

// 沿时间线拖动：按未变形的比例换算
let scrubbing = false;
const scrub = clientX => {
  const L = M.left + M.px + M.R * 0.8, R = M.left + M.W - M.px - M.R * 0.8;
  const f = Math.max(0, Math.min(1, (clientX - L) / (R - L)));
  go(Math.round(f * (vis.length - 1)));
};
railHit.addEventListener("pointerdown", e => { scrubbing = true; railHit.setPointerCapture(e.pointerId); scrub(e.clientX); });
railHit.addEventListener("pointermove", e => { if (scrubbing) scrub(e.clientX); });
railHit.addEventListener("pointerup", () => { scrubbing = false; });
railHit.addEventListener("pointercancel", () => { scrubbing = false; });

/* ---------- Filters ---------- */
const filtersEl = $("#filters");
const keys = Object.keys(CATS);
const active = new Set(keys);
const chipAll = document.createElement("button");
chipAll.className = "chip"; chipAll.type = "button";
chipAll.innerHTML = `全部<span class="n">${EVENTS.length}</span>`;
chipAll.addEventListener("click", () => { keys.forEach(x => active.add(x)); applyFilter(); });
filtersEl.appendChild(chipAll);
const chips = {};
Object.entries(CATS).forEach(([key, c]) => {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button";
  b.style.setProperty("--k", c.color);
  b.innerHTML = `<i></i>${c.name}<span class="n">${EVENTS.filter(e => e.c === key).length}</span>`;
  b.addEventListener("click", () => {
    if (active.size === keys.length) { active.clear(); active.add(key); } // 全选时点某类 = 只看这一类
    else if (active.has(key)) active.delete(key);
    else active.add(key);
    if (!active.size) keys.forEach(x => active.add(x));
    applyFilter();
  });
  filtersEl.appendChild(b);
  chips[key] = b;
});

function applyFilter() {
  chipAll.setAttribute("aria-pressed", active.size === keys.length);
  Object.entries(chips).forEach(([key, b]) => b.setAttribute("aria-pressed", active.has(key)));
  const curTime = vis[k]?._e.time ?? 0;
  vis = dots.filter(el => active.has(el._e.c));
  const next = vis.findIndex(el => el._e.time >= curTime);
  k = next === -1 ? vis.length - 1 : next;
  $("#hint").textContent = `滚动滚轮、按方向键，或沿时间线拖动，共 ${vis.length} 个节点`;
  shownEl = null;
  render();
}

let resizeT;
addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => { measure(); layout(); }, 100); });
// 字体晚到时字宽会变，重新量一次
document.fonts?.addEventListener?.("loadingdone", () => { if (M.W) { measure(); layout(); } });
Promise.race([document.fonts?.ready || Promise.resolve(), new Promise(r => setTimeout(r, 1200))]).then(() => {
  measure();
  applyFilter();
  void document.body.offsetWidth; // 先落定首帧位置，再开启过渡
  $("#app").classList.add("booted");
});
</script>
</body>
</html>
